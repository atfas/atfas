<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="112" viewBox="0 0 1000 112" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Inter, Arial, sans-serif">
  <defs>
    <radialGradient id="hi" cx=".5" cy="0" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="1000" height="112" rx="20"/></clipPath>
  </defs>
  <style>
  .up { opacity: 0; animation: up .9s cubic-bezier(.2,.8,.2,1) .1s forwards; }
  @keyframes up { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  @media (prefers-reduced-motion: reduce) { .up { animation: none; opacity: 1 } }
</style>
  <g clip-path="url(#c)">
    <rect width="1000" height="112" fill="#8c2d19"/>
    <rect width="1000" height="112" fill="url(#hi)"/>
  </g>
  <text class="up" x="500" y="68" text-anchor="middle" font-size="34" fill="#fff" letter-spacing="-.8">
    <tspan font-weight="700">Afonso Saraiva</tspan><tspan font-weight="400" fill-opacity=".45" dx="10">·</tspan><tspan font-weight="500" fill-opacity=".78" dx="10">MSc @ FEUP</tspan>
  </text>
</svg>